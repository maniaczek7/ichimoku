spring.application.name=ichimoku-screener
server.port=8081
spring.jackson.serialization.write-dates-as-timestamps=false
spring.mvc.async.request-timeout=600000

# Forex → TwelveData (primary), Yahoo (fallback)
# Stocks (GPW, US) → Yahoo
screener.twelvedata.api-key=${TWELVEDATA_API_KEY:0e9e4259e96f4fde8f96dc6347c3ebef}
# Switch to fallback after N consecutive failures per provider+asset
screener.data-source.failover-threshold=5

# H2 file-based database
spring.datasource.url=jdbc:h2:file:./data/ichimoku-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2
