services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: ichimoku-backend
    volumes:
      - db-data:/app/data
    environment:
      - TZ=Europe/Warsaw
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/app/data/ichimoku-db;AUTO_SERVER=TRUE
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/screener/forex-groups"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: ichimoku-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
